on:
  push:
    tags:
      - "v*"

env:
  app-name: blinker

jobs:
  build:
    runs-on: ubuntu-latest
    # container:
    #   image: docker.io/electronuserland/builder:wine
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: "25"

      - name: Install Tauri dependencies (debian)
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install application dependencies
        run: npm ci

      - name: Build application
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          export HOME=${{ github.workspace }}
          ./update-version.sh

          npm run tauri build
      
      - name: Create the binary archive
        run: tar -c --xz -f ${{ env.app-name }}.tar.xz ./src-tauri/target/release/${{ env.app-name }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        id: upload-artifact
        with:
          name: linux-packages
          path: |
            ./${{ env.app-name }}.tar.xz
            ./src-tauri/target/release/bundle/appimage/${{ env.app-name }}.AppImage
            ./src-tauri/target/release/bundle/rpm/${{ env.app-name }}*.rpm
            ./src-tauri/target/release/bundle/deb/${{ env.app-name }}*.deb

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: linux-packages
          subject-digest: sha256:${{ steps.upload-artifact.outputs.artifact-digest }}

  release:
    runs-on: ubuntu-slim
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8
        id: download-artifact
        with:
          name: linux-packages

      - name: GH Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: ${{ steps.download-artifact.outputs.download-path }}/*

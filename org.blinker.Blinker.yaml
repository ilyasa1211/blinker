id: org.blinker.Blinker
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: blinker
rename-icon: blinker
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # - --share=network

modules:
  - name: blinker
    buildsystem: simple
    build-commands:
      - install -Dm755 blinker /app/bin/blinker
    post-install:
      - install -Dm644 ./org.blinker.Blinker.desktop ${FLATPAK_DEST}/share/applications/org.blinker.Blinker.desktop
      - install -Dm644 ./app-icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/blinker.svg
    sources:
      - type: file
        path: src-tauri/target/release/blinker
      - type: file
        path: ./app-icon.svg
      - type: file
        path: ./org.blinker.Blinker.desktop
